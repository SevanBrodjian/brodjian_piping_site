name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Every image dropped into photos/ shows up in the gallery automatically,
      # in alphabetical filename order. No manual manifest editing needed.
      - name: Build photo manifest
        run: |
          {
            echo "/* Generated at deploy time from the contents of photos/. */"
            echo "window.GALLERY_PHOTOS = ["
            find photos -maxdepth 1 -type f \
              \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' -o -iname '*.gif' -o -iname '*.avif' \) \
              | sort | sed 's/.*/  "&",/'
            echo "];"
          } > photos/photos.js
          echo "Manifest:" && cat photos/photos.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
