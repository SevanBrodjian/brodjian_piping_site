name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Any image dropped into photos/ (straight off a phone is fine) is
      # optimized for the web and added to the gallery automatically, in
      # alphabetical filename order. Nothing to edit by hand.
      - name: Optimize photos and build manifest
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick libheif-examples > /dev/null
          shopt -s nullglob nocaseglob
          cd photos

          # iPhone HEIC -> JPG
          for f in *.heic *.heif; do
            heif-convert "$f" "${f%.*}.jpg" && rm -f "$f"
          done

          # big PNG screenshots -> flattened JPG
          for f in *.png; do
            convert "$f" -auto-orient -background '#0b0f1f' -flatten \
              -resize '1600x1600>' -quality 84 "${f%.*}.jpg" && rm -f "$f"
          done

          # cap size / bake orientation on everything else
          for f in *.jpg *.jpeg *.webp; do
            mogrify -auto-orient -resize '1600x1600>' -quality 84 "$f"
          done

          {
            echo "/* Generated at deploy time from the contents of photos/. */"
            echo "window.GALLERY_PHOTOS = ["
            find . -maxdepth 1 -type f \
              \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' -o -iname '*.gif' -o -iname '*.avif' \) \
              | sed 's|^\./||' | sort | sed 's/.*/  "photos\/&",/'
            echo "];"
          } > photos.js
          echo "Manifest:" && cat photos.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
